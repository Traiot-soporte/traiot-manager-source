<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191919" />
    <meta name="application-name" content="TRAIOT Manager" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="TRAIOT MANAGER — operación GPS e IoT" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>TRAIOT MANAGER</title>
    <script>
      try {
        const savedTheme = window.localStorage.getItem('traiot-theme')
        const useDarkTheme = savedTheme
          ? savedTheme === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', useDarkTheme)
      } catch {
        // El tema claro se mantiene si el navegador bloquea el almacenamiento local.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('root').innerHTML =
          '<main style="max-width:680px;margin:10vh auto;padding:32px;font-family:\'Exo 2\',sans-serif;color:#191919">' +
          '<h1>TRAIOT MANAGER</h1>' +
          '<p>Esta aplicación no está disponible desde este archivo.</p>' +
          '<p>Abre TRAIOT Manager desde la dirección proporcionada por tu administrador.</p>' +
          '</main>'
      }
    </script>
    <noscript>TRAIOT MANAGER necesita JavaScript habilitado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
