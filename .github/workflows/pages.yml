name: Publicar demostracion en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar sitio
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias verificadas
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Revisar calidad del codigo
        run: npm run lint

      - name: Compilar demostracion
        env:
          VITE_BASE_PATH: /traiot-manager-source/
          VITE_APPS_SCRIPT_BRIDGE_URL: ${{ vars.TRAIOT_APPS_SCRIPT_BRIDGE_URL }}
        run: npm run build

      - name: Subir sitio compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar sitio
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
