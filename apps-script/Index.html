    <script>

        const savedTheme = window.localStorage.getItem('traiot-theme')

          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', useDarkTheme)
      } catch {
        // El tema claro se mantiene si el navegador bloquea el almacenamiento local.
      }
